name: Build Desktop App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: KlassenKloTerminal-windows
          - os: macos-latest
            artifact_name: KlassenKloTerminal-mac
          - os: ubuntu-latest
            artifact_name: KlassenKloTerminal-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build executable
        run: pyinstaller klassen_klo_terminal.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
